function analyze(){
  const S=[...D].sort((a,b)=>a.s-b.s),W=S.filter(x=>x.t==='work');
  const daily=[];let prevShort=false;
  for(let k=0;k<W.length-1;k++){
    const a=W[k],b=W[k+1],ia=S.indexOf(a),ib=S.indexOf(b);let gaps=[],c0=a.e;
    for(let i=ia+1;i<ib;i++){if(S[i].s>c0)gaps.push([c0,S[i].s]);c0=Math.max(c0,S[i].e)}
    if(b.s>c0)gaps.push([c0,b.s]);if(!gaps.length)gaps.push([a.e,a.e]);
    const mx=Math.max(...gaps.map(g=>(g[1]-g[0])/H)),req=prevShort?13:11;let c,msg;
    if(mx>=req){c='ok';msg='Splněno';prevShort=false}
    else if(req===11&&mx>=8){c='wa';msg='Zkráceno (min. 8 h)';prevShort=true}
    else{c='er';msg=mx<8?'Nesplněno (pod 8 h)':'Nesplněno (po zkrácení má být 13 h)';prevShort=false}
    daily.push({id:b.id,a:a.e,b:b.s,mx,req,c,msg});
  }
  const wk={};let cu=S.length?S[0].e:0;
  for(let i=1;i<S.length;i++){if(S[i].s>cu){const w=mon(cu),g=(S[i].s-cu)/H;if(!wk[w]||g>wk[w].g)wk[w]={g,a:cu,b:S[i].s}}cu=Math.max(cu,S[i].e)}
  const weekly=[];let ps=false;
  Object.keys(wk).map(Number).sort((a,b)=>a-b).forEach(w=>{
    const {g,a,b}=wk[w],req=ps?72:35;let c,msg;
    if(g>=req){c='ok';msg='Splněno';ps=false}
    else if(req===35&&g>=24){c='wa';msg='Zkráceno (min. 24 h)';ps=true}
    else{c='er';msg=g<24?'Nesplněno (pod 24 h)':'Nesplněno (po zkrácení má být 72 h)';ps=false}
    weekly.push({w,g,a,b,req,c,msg});
  });
  return {S,daily,weekly,prevShort,ps};
}

function card(c,t,big,of,pct,tick,sub,nx){return `<div class="sc ${c}"><div class="ico">${c==='ok'?'✓':c==='wa'?'!':'✕'}</div><div class="bd"><div class="tt">${t}</div><div class="big">${big} <small>${of}</small></div><div class="bar"><u style="width:${pct}%"></u><em style="left:${tick}%"></em></div><div class="sub">${sub}</div><div class="nx">${nx}</div></div></div>`}

  const end=Math.max(...A.S.map(x=>x.e)),ld=A.daily[A.daily.length-1],dReq=A.prevShort?13:11;
  const dn=`➜ Nástup nejdřív <b>${f(end+dReq*H)}</b> (${dReq} h)${dReq===11?`<br>Nouzově ${f(end+8*H)} (8 h) → pak příští odpočinek 13 h`:''}`;
  let h=ld?card(ld.c,'Denní odpočinek',hh(ld.mx),'z '+ld.req+' h',Math.min(ld.mx/ld.req*100,100),8/ld.req*100,ld.msg+' · '+f(ld.a)+' → '+f(ld.b),dn)
    :card('wa','Denní odpočinek','—','',0,0,'Zatím nelze určit (potřeba dvě směny)',dn);
  const lw=mon(end),cw=A.weekly.find(x=>x.w===lw),sw=cw||A.weekly[A.weekly.length-1],wr=cw?cw.req:(A.ps?72:35);

  else wn=`➜ Když skončíš ${f(end)}, nastup nejdřív <b>${f(end+wr*H)}</b> (${wr} h vcelku)${wr===35?`<br>Nouzově ${f(end+24*H)} (24 h) → pak příští týden 72 h`:''}`;
  h+=sw?card(sw.c,'Víkend / týdenní odpočinek',hh(sw.g),'z '+sw.req+' h',Math.min(sw.g/sw.req*100,100),(sw.req===35?24/35:24/72)*100,sw.msg+' · '+f(sw.a)+' → '+f(sw.b),wn)

  const tbl=`<div class="card tb"><div class="tt">Kdy můžu do práce · po odchodu ${f(end)}</div><table><tr><th></th><th>Podle zákona</th><th>Nouzově (8 / 24 h)</th></tr><tr><td class="rh">Denní odpočinek</td><td>${dn1}</td><td>${dn2}</td></tr><tr><td class="rh">Týdenní odpočinek (víkend)</td>${wrow}</tr></table></div>`;
  $('st').innerHTML=tbl+h;
}

    if(!window.html2canvas||!window.jspdf)throw new Error('knihovny pro PDF se nenačetly');
    const A=analyze(),dm={};A.daily.forEach(x=>dm[x.id]=x);
    const y=cur.getFullYear(),m=cur.getMonth(),s=stats(),days={},G='#00893d';
    A.S.forEach(x=>{const d=new Date(x.s);if(d.getFullYear()===y&&d.getMonth()===m)(days[key(x.s)]=days[key(x.s)]||[]).push(x)});
    const TH='padding:7px 8px;background:#00893d;color:#fff;font-size:11px;font-weight:700;',TD='padding:7px 8px;border-bottom:1px solid #dfe7e2;vertical-align:middle;white-space:nowrap;';
    const rows=[...new Set([...Object.keys(days),...Object.keys(DT).filter(q=>q.startsWith(y+'-'+p(m+1)+'-'))])].sort().map(k=>{const es=days[k]||[],dt=DT[k],w=es.filter(x=>x.t==='work'),c=es.filter(x=>x.t==='call'),r=w.map(x=>dm[x.id]).filter(Boolean)[0];
      const sh=w.reduce((a,x)=>a+wh(x),0)+(dt==='ho'&&!w.length?prof.fund/5*H:0),ch=c.reduce((a,x)=>a+x.e-x.s,0),col=r?(r.c==='ok'?'#00893d':r.c==='wa'?'#b26a00':'#c62828'):'#1b2620';
      return `<tr><td style="${TD}font-weight:700">${new Date(k+'T00:00:00').toLocaleDateString('cs-CZ',{weekday:'short',day:'numeric',month:'numeric'})}</td><td style="${TD}">${dt==='off'&&!w.length?'Volno':dt==='ho'&&!w.length?'HO':w.map(x=>hm(x.s)+'–'+hm(x.e)).join(', ')||'–'}</td><td style="${TD}text-align:right">${sh?hh(sh/H):''}</td><td style="${TD}white-space:normal;font-size:11px">${c.map(x=>hm(x.s)+'–'+hm(x.e)).join(', ')||'–'}</td><td style="${TD}text-align:right">${ch?hh(ch/H):''}</td><td style="${TD}color:${col};font-weight:600">${r?hh(r.mx)+' · '+r.msg.split(' (')[0]:''}</td></tr>`});
    const mn=cur.toLocaleDateString('cs-CZ',{month:'long',year:'numeric'});
    const head=`<table style="width:100%;border-collapse:collapse;table-layout:fixed"><colgroup><col style="width:13%"><col style="width:17%"><col style="width:14%"><col style="width:21%"><col style="width:14%"><col style="width:21%"></colgroup><tr><th style="${TH}text-align:left">Datum</th><th style="${TH}text-align:left">Směna</th><th style="${TH}text-align:right">Doba směny</th><th style="${TH}text-align:left">Zásah</th><th style="${TH}text-align:right">Doba zásahů</th><th style="${TH}text-align:left">Odpočinek před směnou</th></tr>`;
    const total=`<tr style="background:#eef5f0;font-weight:700"><td style="${TD}">Celkem</td><td style="${TD}"></td><td style="${TD}text-align:right">${hh(s.sh/H)}</td><td style="${TD}"></td><td style="${TD}text-align:right">${hh(s.ca/H)}</td><td style="${TD}"></td></tr>`;
    const summary=`<div style="margin-top:18px;display:flex;gap:10px">${[['Směny',hh(s.sh/H)],['Doba zásahů',hh(s.ca/H)],['Fond ('+s.days+' prac. dní)',hh(s.fund/H)],['Směny − fond',sg(s.sh-s.fund)]].map(q=>`<div style="flex:1;border:1px solid #dfe7e2;border-top:3px solid ${G};border-radius:6px;padding:8px 10px"><div style="font-size:10px;color:#5f6f66">${q[0]}</div><div style="font-size:16px;font-weight:700;color:#006b30">${q[1]}</div></div>`).join('')}</div>${s.off?`<div style="font-size:11px;color:#5f6f66;margin-top:6px">Ve fondu odečteno ${s.off} dní svátků / volna.</div>`:''}<div style="font-size:10px;color:#5f6f66;margin-top:6px">Doba směny je po odečtení pauzy na oběd (${LUNCH_MIN} min u směn nad ${LUNCH_FROM_H} h).</div><div style="margin:16px 0 6px;font-weight:700;color:#006b30">Přehled po týdnech</div>${repWeeks()}<div style="display:flex;justify-content:space-between;margin-top:54px"><div style="border-top:1px solid #6b7a71;width:42%;padding-top:5px;color:#5f6f66">Podpis zaměstnance</div><div style="border-top:1px solid #6b7a71;width:42%;padding-top:5px;color:#5f6f66">Podpis nadřízeného</div></div>`;
    const P1=19,PN=27,chunks=[];let i=0;chunks.push(rows.slice(0,P1));i=P1;while(i<rows.length){chunks.push(rows.slice(i,i+PN));i+=PN}
    const last=chunks[chunks.length-1],cap=chunks.length===1?P1:PN,sumOnLast=last.length<=cap-11;
    const pages=chunks.map((c,n)=>({tbl:head+c.join('')+(n===chunks.length-1?total:'')+'</table>',sum:n===chunks.length-1&&sumOnLast}));
    if(!sumOnLast)pages.push({tbl:'',sum:true});
    const logo=`<div style="border-bottom:4px solid ${G};padding-bottom:8px;margin-bottom:12px"><div style="font-size:21px;color:#3c4350"><b style="color:${G}">Schaeffler</b> motion technologies</div><div style="font-size:15px;margin-top:4px;color:#1b2620">Docházka – ${esc(mn)}</div></div><div style="margin-bottom:12px;font-size:12px"><b>Jméno:</b> ${esc(prof.name||'—')} &nbsp;&nbsp;|&nbsp;&nbsp; <b>Týdenní fond:</b> ${hh(prof.fund)}</div>`;
    const small=`<div style="border-bottom:2px solid ${G};padding-bottom:6px;margin-bottom:12px;font-size:12px;color:#3c4350"><b style="color:${G}">Schaeffler</b> motion technologies · Docházka – ${esc(mn)} · ${esc(prof.name||'—')}</div>`;
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    for(let n=0;n<pages.length;n++){
      $('rep').innerHTML=`<div style="width:794px;height:1123px;box-sizing:border-box;padding:40px 44px;background:#fff;color:#1b2620;font:12px/1.35 Arial,Helvetica,sans-serif;position:relative;overflow:hidden">${n?small:logo}${pages[n].tbl}${pages[n].sum?summary:''}<div style="position:absolute;bottom:20px;right:44px;font-size:10px;color:#6b7a71">Strana ${n+1} / ${pages.length}</div></div>`;
      const cv=await html2canvas($('rep').firstElementChild,{scale:2,backgroundColor:'#fff'});
      if(n)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',.93),'JPEG',0,0,210,297);
    }
    const r=await saveFile('dochazka-'+y+'-'+p(m+1)+'.pdf',pdf.output('blob'));
    if(r!=='declined')toast('PDF je připravené ✓');
  }catch(e){toast('Export se nepodařil: '+((e&&e.message)||e))}
  finally{btn.textContent=old;$('rep').innerHTML=''}
}
function mv(n){cur.setMonth(cur.getMonth()+n);render()}
function pick(k){sel=k===sel?null:k;delArm=false;render()}
function mk(s,a,z){const d=new Date(s+'T00:00:00'),[ah,am]=a.split(':'),[zh,zm]=z.split(':');
  const S=new Date(d);S.setHours(+ah,+am,0,0);const E=new Date(d);E.setHours(+zh,+zm,0,0);if(E<=S)E.setDate(E.getDate()+1);return [S.getTime(),E.getTime()]}
function add(t,a,z){if(!a){const l=D.filter(x=>x.t===t).sort((x,y)=>y.s-x.s)[0];[a,z]=l?[hm(l.s),hm(l.e)]:(t==='work'?['06:00','14:00']:['22:00','23:00'])}const [s,e]=mk(sel,a,z);D.push({id:uid(),s,e,t});save();render()}
function norm(v){v=(v||'').replace(/[^0-9:.,]/g,'').replace(/[.,]/,':');let h,m;if(v.includes(':')){[h,m]=v.split(':')}else if(v.length<=2){h=v;m='0'}else{m=v.slice(-2);h=v.slice(0,-2)}h=+h;m=+m||0;if(isNaN(h)||h>24||m>59)return null;if(h===24)h=0;return p(h)+':'+p(m)}
let rf=null;
const SH=['06:00-14:00','06:00-14:30','06:30-14:30','06:30-15:00'];
let cs='22:00';
function tp(x,c){const t=c==='a'?x.s:x.e;return `<div class="tp"><button class="g sb m" onclick="step('${x.id}','${c}',-15)"></button><input type="text" class="${c} tm" inputmode="numeric" maxlength="5" value="${hm(t)}" onchange="upd('${x.id}',this.closest('.r'))" onkeydown="tkey(event)" onfocus="this.select()"><button class="g sb pl" onclick="step('${x.id}','${c}',15)"></button></div>`}
function step(id,c,d){const x=D.find(q=>q.id===id);if(!x)return;const m=d*6e4;let a=x.s,b=x.e;if(c==='a'){a+=m;if(x.t==='call')b+=m}else b+=m;if(b<=a||key(a)!==key(x.s))return;x.s=a;x.e=b;save();render()}
function dur(id,m){const x=D.find(q=>q.id===id);if(!x)return;x.e=x.s+m*6e4;save();render()}
function csS(d){const [h,m]=cs.split(':').map(Number);const t=(h*60+m+d+1440)%1440;cs=p(Math.floor(t/60))+':'+p(t%60);render()}
function csSet(v){const n=norm(v);if(n)cs=n;render()}
function addCall(m){const [h,mi]=cs.split(':').map(Number),d=new Date(sel+'T00:00:00');d.setHours(h,mi,0,0);D.push({id:uid(),s:d.getTime(),e:d.getTime()+m*6e4,t:'call'});save();render()}

function tkey(e){const i=e.target;if(e.key==='Enter'){i.blur();return}if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;e.preventDefault();const v=norm(i.value);if(!v)return;const [h,m]=v.split(':').map(Number);let t=h*60+m+(e.key==='ArrowUp'?1:-1)*(e.shiftKey?60:15);t=(t+1440)%1440;i.value=p(Math.floor(t/60))+':'+p(t%60);rf={id:i.closest('.r').dataset.id,c:i.classList.contains('a')?'a':'z'};i.dispatchEvent(new Event('change'))}
function upd(id,row){const x=D.find(q=>q.id===id);if(!x)return;const a=norm(row.querySelector('.a').value),z=norm(row.querySelector('.z').value);if(!a||!z){render();return}[x.s,x.e]=mk(key(x.s),a,z);save();render()}
function del(id){D=D.filter(x=>x.id!==id);save();render()}
let th0='light';try{th0=localStorage.getItem('dochazka_theme')||'light'}catch(e){}applyTheme(th0);
$('pn').value=prof.name;$('pf').value=prof.fund;$('pn').onchange=$('pf').onchange=setProf;
if(CLOUD)initCloud();else render();
